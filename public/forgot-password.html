<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>WorkOrder Pro - Admin Login</title>
  <link href="./css/bootstrap.min.css" rel="stylesheet" />
  <link href="./css/uicons-regular-straight.css" rel="stylesheet" />
  <link href="./css/uicons-solid-rounded.css" rel="stylesheet" />
  <link href="./css/uicons-brands.css" rel="stylesheet" />
  <link href="./css/style.css" rel="stylesheet" />
  <script src="./js/bootstrap.bundle.min.js"></script>
</head>

<body class="login-page">
  <div class="login-card">
    <img alt="WorkOrder Pro Logo" src="./images/logo-2.svg" />
    <!-- Input Form -->
    <form>
      <div class="form-group">
        <label class="form-label"> Email Address </label>
        <div class="input-group">
          <input class="form-control form-control-styled" placeholder="Enter your email" required="" type="email"
            value="admin@fieldops.com" />
        </div>
      </div>
      <a class="btn btn-primary btn-primary-custom sign-in" href="login.html">
        Send Reset Link
      </a>
      <div class="back-to-login-text">
        <a class="no-underline wt-medium back-to-login-text-a-custom" href="login.html">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</body>

</html>
