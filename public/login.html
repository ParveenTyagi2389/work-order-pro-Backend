<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>WorkOrder Pro - Admin Login</title>
  <link href="./css/bootstrap.min.css" rel="stylesheet" />
  <link href="./css/uicons-regular-straight.css" rel="stylesheet" />
  <link href="./css/uicons-solid-rounded.css" rel="stylesheet" />
  <link href="./css/uicons-brands.css" rel="stylesheet" />
  <link href="./css/style.css" rel="stylesheet" />
  <script src="./js/bootstrap.bundle.min.js"></script>
</head>

<body class="login-page">
  <div class="login-card">
    <img alt="WorkOrder Pro Logo" src="./images/logo-2.svg" />
    <div class="subtitle">Admin Panel</div>
    <!-- Input Form -->
    <form action="dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label"> Email Address </label>
        <input class="form-control form-control-styled" placeholder="Enter your email" required="" type="email"
          value="admin@fieldops.com" />
      </div>
      <div class="form-group">
        <label class="form-label"> Password </label>
        <input class="form-control form-control-styled" placeholder="Enter your password" required="" type="password"
          value="password" />
      </div>
      <div class="forgot-password-text">
        <a class="forgot-password-text-a-custom" href="forgot-password.html">
          Forgot password?
        </a>
      </div>
      <a class="btn-primary btn-primary-custom sign-in" href="dashboard.html" type="button">
        Sign In
      </a>
    </form>
  </div>
</body>

</html>
